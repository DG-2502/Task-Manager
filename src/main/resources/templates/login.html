<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="card">
    <h1>Log in</h1>

    <div class="success-banner" th:if="${successMessage}" th:text="${successMessage}"></div>

    <form method="post" action="/login">
        <label>
            <input type="text" name="username" placeholder="Username"
                   th:value="${username != null ? username : registeredUsername}"
                   th:classappend="${loginError != null} ? 'input-error' : ''">
        </label>
        <label>
            <input type="password" name="password" placeholder="Password"
                   th:classappend="${loginError != null} ? 'input-error' : ''">
        </label>
        <p class="field-error" th:if="${loginError}" th:text="${loginError}"></p>

        <button type="submit">Log in</button>
    </form>

    <p class="link-row">
        Don't have an account? <a th:href="@{/register}">Register</a>
    </p>
</div>
</body>
</html>
